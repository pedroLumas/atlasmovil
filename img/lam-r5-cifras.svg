lvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#93A3B8" text-anchor="middle">esclavos (millones)</text><text x="14" y="24" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="750" fill="#DBE4EE" text-anchor="start" stroke="#0A1119" stroke-width="4.5" stroke-linejoin="round" paint-order="stroke">Cuánta gente vivía en Italia: las dos contabilidades</text><text x="14" y="41" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#93A3B8" text-anchor="start">millones de habitantes, según cómo se lea el censo de 28 a.C.</text><rect x="66" y="410" width="13" height="4.5" rx="2.2" fill="#4E9BE0"/><text x="85" y="415" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="550" fill="#DBE4EE" text-anchor="start">Lectura baja (Beloch, Brunt)</text><rect x="292" y="410" width="13" height="4.5" rx="2.2" fill="#86E85C"/><text x="311" y="415" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="550" fill="#DBE4EE" text-anchor="start">Lectura alta (Lo Cascio)</text></svg>