="#0A1119" stroke-width="4.5" stroke-linejoin="round" paint-order="stroke">El servicio de la Rana Verde: dónde estaba el dinero de verdad</text><text x="14" y="41" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#93A3B8" text-anchor="start">libras esterlinas de 1774</text><rect x="66" y="410" width="13" height="4.5" rx="2.2" fill="#93A3B8"/><text x="85" y="415" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="550" fill="#DBE4EE" text-anchor="start">hacer la loza (barro, hornos, mano de obra)</text><rect x="397" y="410" width="13" height="4.5" rx="2.2" fill="#4E9BE0"/><text x="416" y="415" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="550" fill="#DBE4EE" text-anchor="start">pintarla: 952 piezas, 952 vistas distintas</text><rect x="721" y="410" width="13" height="4.5" rx="2.2" fill="#E8705A"/><text x="740" y="415" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="550" fill="#DBE4EE" text-anchor="start">beneficio de Wedgwood en el encargo</text></svg>