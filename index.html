<!doctype html>
<html lang="es" data-theme="cristal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="ATLAS: lecciones de historia para leer en el móvil, con un mapa que se ilumina según lo que lees.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATLAS">
<title>ATLAS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="estilo.css?v=20261011132559">
</head>
<body class="cargando">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-rosa" viewBox="0 0 48 48"><path fill="currentColor" stroke="none" d="M24 1l4.2 18.8L47 24l-18.8 4.2L24 47l-4.2-18.8L1 24l18.8-4.2z"/><circle cx="24" cy="24" r="12.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path fill="none" stroke="currentColor" stroke-width="1.4" d="M11 11l9 9M37 11l-9 9M11 37l9-9M37 37l-9-9"/></symbol>
  <symbol id="i-atras" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-mapa" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.4"/><path d="M12 3.5v2.6M12 17.9v2.6M3.5 12h2.6M17.9 12h2.6"/></symbol>
  <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-ajustar" viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/><circle cx="12" cy="12" r="2.2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.6 4.6L19 7.6"/></symbol>
  <symbol id="i-azar" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r=".9"/><circle cx="15" cy="9" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="9" cy="15" r=".9"/><circle cx="15" cy="15" r=".9"/></symbol>
  <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-lupa" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-sigue" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
</svg>

<div id="app">
  <header id="barra">
    <button class="logo" id="logo" aria-label="ATLAS, ir a las lecciones"><svg class="rosa"><use href="#i-rosa"/></svg><span>ATLAS</span></button>
    <button class="pill" id="b-menu" aria-label="Progreso y ajustes">
      <svg class="anillito" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" class="trk"/><circle cx="16" cy="16" r="12" class="abre" id="an-a"/><circle cx="16" cy="16" r="12" class="lee" id="an-l"/></svg>
      <span id="b-pct">0 %</span>
    </button>
  </header>

  <main id="vistas">
    <section id="v-lista" class="vista on" aria-label="Lecciones">
      <div class="buscar-fila">
        <label class="buscar-w"><svg class="ic"><use href="#i-lupa"/></svg><input id="q" type="search" placeholder="Buscar lecciones" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></label>
        <button class="dado" data-azar aria-label="Abrir una lección al azar"><svg class="ic"><use href="#i-azar"/></svg></button>
      </div>
      <div class="filtros">
        <div class="chips" id="ch-estado" role="group" aria-label="Estado de lectura"></div>
        <div class="chips" id="ch-region" role="group" aria-label="Región"></div>
        <div class="cuenta-fila"><span id="cuenta"></span><button id="orden" class="lnk" aria-label="Cambiar el orden"></button></div>
      </div>
      <div id="rapido" class="rapido"></div>
      <div id="lista" class="lista"></div>
      <p class="pie" id="pie"></p>
    </section>

    <section id="v-mapa" class="vista" aria-label="Mapa de lectura">
      <canvas id="cv" aria-label="Mapa en anillo: cada punto es una lección y se ilumina al leerla"></canvas>
      <div class="lente" id="lente" hidden></div>
      <div class="pista" id="pista"></div>
      <div class="zoom-bt">
        <button id="z-mas" aria-label="Acercar"><svg class="ic"><use href="#i-mas"/></svg></button>
        <button id="z-menos" aria-label="Alejar"><svg class="ic"><use href="#i-menos"/></svg></button>
        <button id="z-fit" aria-label="Ver todo el anillo"><svg class="ic"><use href="#i-ajustar"/></svg></button>
      </div>
      <div class="sel" id="sel" hidden></div>
    </section>
  </main>

  <nav id="tabs" aria-label="Secciones">
    <button id="t-lista" class="on"><svg class="ic"><use href="#i-lista"/></svg><span>Lecciones</span></button>
    <button id="t-mapa"><svg class="ic"><use href="#i-mapa"/></svg><span>Mapa</span></button>
  </nav>
</div>

<div id="lectura" hidden>
  <div class="l-barra">
    <button id="l-atras" aria-label="Volver"><svg class="ic"><use href="#i-atras"/></svg></button>
    <span class="l-titulo" id="l-titulo"></span>
    <button id="l-menos" class="txt" aria-label="Texto más pequeño">A−</button>
    <button id="l-mas" class="txt" aria-label="Texto más grande">A+</button>
    <button id="l-ok" aria-label="Marcar como leída"><svg class="ic"><use href="#i-check"/></svg></button>
    <i class="l-prog" id="l-prog"></i>
  </div>
  <div class="hoja" id="hoja"></div>
</div>

<div id="menu" hidden><div class="menu-c" id="menu-c" role="dialog" aria-label="Progreso y ajustes"></div></div>
<div id="zoom" hidden><img alt=""><button class="zoom-x" aria-label="Cerrar la imagen"><svg class="ic"><use href="#i-cerrar"/></svg></button></div>
<div id="avisos" aria-live="polite"></div>

<div id="candado" hidden>
  <form id="f-candado" class="tarjeta" autocomplete="off">
    <svg class="rosa"><use href="#i-rosa"/></svg>
    <h1>ATLAS</h1>
    <p>Escribe tu clave para entrar.<br>Solo te la pedirá una vez en este dispositivo.</p>
    <input id="i-clave" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Clave" aria-label="Clave" enterkeyhint="go">
    <button class="btn p" type="submit">Entrar</button>
    <p class="err" id="e-clave" role="alert"></p>
  </form>
</div>
<noscript><p style="padding:24px;color:#ccc;font-family:sans-serif">ATLAS necesita JavaScript.</p></noscript>
<script src="app.js?v=20261011132559"></script>
</body>
</html>
